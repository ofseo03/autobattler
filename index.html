<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시즌 기록부</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f7f7f5'/%3E%3Crect x='3' y='3' width='10' height='10' fill='none' stroke='%2377776f'/%3E%3C/svg%3E">
  <style>
    /* ── 기본 ───────────────────────────────────────────────── */
    :root {
      --bg: #f7f7f5; --card: #ffffff; --line: #e0e0dd; --text: #2b2b2b; --muted: #77776f;
      --accent: #4a6fa5; --good: #3d7a4e; --bad: #a04a42; --good-bg: #eef4ef; --bad-bg: #f6eceb; --hover: #f1f1ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 14px/1.5 system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-variant-numeric: tabular-nums; padding: 16px; }
    #app { max-width: 1000px; margin: 0 auto; }
    h1, h2, h3 { font-weight: 600; margin: 0; }
    h1 { font-size: 18px; } h2 { font-size: 15px; } h3 { font-size: 13px; color: var(--muted); text-transform: none; }
    p { margin: 0; }
    button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer; transition: background 120ms; }
    button:hover:not(:disabled) { background: var(--hover); }
    button:disabled { color: var(--muted); cursor: default; opacity: .6; }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.primary:hover:not(:disabled) { background: #eef2f8; }
    button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    input[type=text] { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--card); color: var(--text); width: 100%; max-width: 240px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    td.num, th.num { text-align: right; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .good { color: var(--good); } .bad { color: var(--bad); } .accent { color: var(--accent); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; }
    .topbar { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .topbar .k { color: var(--muted); font-size: 12px; margin-right: 4px; }
    .notice { font-size: 13px; color: var(--muted); padding: 6px 10px; border: 1px dashed var(--line); border-radius: 3px; background: var(--card); }
    .wrap { overflow-x: auto; }
    kbd { font: 11px/1 system-ui, sans-serif; border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; background: var(--card); color: var(--muted); }

    /* ── 선수 카드(축약) ─────────────────────────────────────── */
    .pc { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
    .pc .name { font-weight: 600; }
    .pc .meta { color: var(--muted); font-size: 12px; }
    .tags { font-size: 12px; }
    .tags span { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 3px; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; font-size: 12px; }
    .stats b { font-weight: 600; font-size: 14px; display: block; }
    .stats .lbl { color: var(--muted); }
    .stats .up { color: var(--good); }
    .stats .down { color: var(--bad); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .cards .card { display: flex; flex-direction: column; gap: 6px; }
    .cards .card .spacer { flex: 1; }

    /* ── 드래프트 ───────────────────────────────────────────── */
    .choices { display: flex; flex-wrap: wrap; gap: 6px; }
    .choices button.on { border-color: var(--accent); color: var(--accent); background: #eef2f8; }
    .alloc { display: grid; grid-template-columns: repeat(4, minmax(60px, 1fr)); gap: 8px; max-width: 420px; }

    /* ── 배치 ───────────────────────────────────────────────── */
    .lineup-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; align-items: start; }
    @media (max-width: 720px) { .lineup-grid { grid-template-columns: 1fr; } }
    .slots { display: flex; flex-direction: column; gap: 4px; }
    .slot { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-height: 46px; cursor: grab; transition: background 120ms, border-color 120ms; }
    .slot .no { color: var(--muted); font-size: 12px; }
    .slot.empty { color: var(--muted); border-style: dashed; cursor: default; }
    .slot.cursor, .bench-item.cursor, .bench-zone.cursor { border-color: var(--accent); }
    .slot.held, .bench-item.held { background: #eef2f8; border-color: var(--accent); }
    .slot.over, .bench-item.over, .bench-zone.over { background: var(--hover); border-color: var(--accent); }
    .slot.me .name::after { content: ' (나)'; color: var(--accent); font-weight: 500; }
    .slot.cleanup { border-left: 3px solid var(--line); }
    .slot .mini { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
    .slot .mini b { color: var(--text); font-weight: 500; }
    .bench { display: flex; flex-direction: column; gap: 4px; }
    .bench-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; cursor: grab; }
    .bench-zone { border: 1px dashed var(--line); border-radius: 3px; padding: 6px 8px; color: var(--muted); font-size: 12px; text-align: center; }
    .syn-list { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
    .syn-list .item { display: grid; grid-template-columns: 1fr; padding: 3px 6px; border-radius: 3px; border-left: 3px solid var(--line); }
    .syn-list .item .d { color: var(--muted); font-size: 12px; }
    .syn-list .item.add { border-left-color: var(--good); background: var(--good-bg); }
    .syn-list .item.add .n::before { content: '+ '; color: var(--good); }
    .syn-list .item.rem { border-left-color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
    .syn-list .item.rem .n::before { content: '− '; color: var(--bad); text-decoration: none; }
    .cleanup-meter { font-size: 13px; }
    .cleanup-meter b { font-size: 16px; }

    /* ── 경기 로그 ──────────────────────────────────────────── */
    .log { font-size: 13px; line-height: 1.7; min-height: 200px; white-space: pre-wrap; }
    .log .syn { color: var(--good); }
    .log .opp { color: var(--muted); }
    .log .end { font-weight: 600; margin-top: 6px; }

    /* ── 결과 / 은퇴 ───────────────────────────────────────── */
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
    .kv .k { color: var(--muted); }
    .growth { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    .growth button { padding: 10px; text-align: left; }
    .growth button .key { color: var(--muted); font-size: 12px; display: block; }

    /* ── 패닉 모드 ─────────────────────────────────────────── */
    #panic { position: fixed; inset: 0; background: #ffffff; color: #111; overflow-y: auto; z-index: 10; }
    #panic .doc { max-width: 760px; margin: 0 auto; padding: 48px 24px 120px; font: 15px/1.8 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif; }
    #panic h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
    #panic h2 { font-size: 17px; margin: 28px 0 8px; font-weight: 700; }
    #panic p { margin: 0 0 12px; text-align: justify; }
    #panic .sub { color: #555; font-size: 13px; margin-bottom: 24px; }
    #panic ul { margin: 0 0 12px 20px; padding: 0; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="panic" hidden></div>

<script>

(function (root) {

// ── 2. 상태: RNG, state 객체, save/load
(function (root) {
  'use strict';
  var AB = root.AB || (root.AB = {});
  var C = AB.C;

  // ── 시드 가능한 난수 (mulberry32). 테스트/밸런스 시뮬 재현용
  var rng = (function () {
    var s = (Date.now() >>> 0) || 1;
    function next() {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      seed: function (n) { s = (n >>> 0) || 1; },
      state: function () { return s; },
      next: next,
      chance: function (p) { return next() < p; },
      int: function (a, b) { return a + Math.floor(next() * (b - a + 1)); },       // [a, b]
      range: function (a, b) { return a + next() * (b - a); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      // 근사 정규분포 (평균 0, 표준편차 1)

      weighted: function (weights) { var r = next() * weights.reduce(function (a, b) { return a + b; }, 0); for (var i = 0; i < weights.length; i++) { r -= weights[i]; if (r < 0) return i; } return weights.length - 1; }
    };
  })();
  AB.rng = rng;

  // ── 저장소: localStorage 가 없으면(테스트/파일 프로토콜 예외) 메모리로 대체
  var memory = {};
  var memoryStorage = {
    getItem: function (k) { return Object.prototype.hasOwnProperty.call(memory, k) ? memory[k] : null; },
    setItem: function (k, v) { memory[k] = String(v); },
    removeItem: function (k) { delete memory[k]; }
  };
  function defaultStorage() {
    try { if (typeof localStorage !== 'undefined' && localStorage) { localStorage.getItem('__t'); return localStorage; } } catch (e) { /* 접근 불가 */ }
    return memoryStorage;

      if (st.phase === 'result' && /^[1-3]$/.test(e.key)) { var idx = parseInt(e.key, 10) - 1; if (st.growthOptions[idx]) { e.preventDefault(); act('grow', String(idx)); } return; }
      if (st.phase !== 'lineup') return;

      if (focused) { items.forEach(function (it, i) { if (itemKey(it) === focused) UI.cursor = i; }); cur = items[UI.cursor]; }

    // ── 패닉 모드 ──────────────────────────────────────────

    function panicDoc() {
      var para = [
        '분산 시스템에서 일관성(consistency)은 여러 복제본이 같은 데이터에 대해 어떤 순서와 시점으로 갱신을 관측하는지를 규정하는 계약이다. 강한 일관성은 모든 읽기가 가장 최근의 쓰기를 반영함을 보장하지만, 네트워크 분할이 발생하면 가용성을 희생해야 한다. 이 절에서는 선형화 가능성(linearizability), 순차 일관성(sequential consistency), 인과 일관성(causal consistency), 최종 일관성(eventual consistency)의 정의를 차례로 살펴보고, 각 모델이 허용하는 실행 이력의 예를 든다.',
        '선형화 가능성은 각 연산이 호출과 응답 사이의 어느 한 시점에 원자적으로 수행된 것처럼 보여야 한다는 조건이다. 실시간 순서를 보존한다는 점에서 순차 일관성보다 강하며, 구현에는 일반적으로 합의(consensus) 프로토콜이 필요하다. Paxos와 Raft가 대표적이며, 두 프로토콜 모두 과반수 정족수를 이용해 단일 리더가 로그 순서를 결정한다.',
        '순차 일관성은 모든 프로세스가 동일한 전역 순서를 관측하되 그 순서가 실시간과 일치할 필요는 없다는 조건이다. 각 프로세스의 프로그램 순서는 보존되어야 한다. 이 모델은 공유 메모리 멀티프로세서의 메모리 모델을 설명할 때 처음 제안되었으며, 분산 저장소에서는 비교적 드물게 채택된다.',
        '인과 일관성은 인과적으로 관련된 쓰기만 순서를 보장한다. 두 쓰기가 동시(concurrent)라면 서로 다른 복제본이 서로 다른 순서로 관측해도 무방하다. 벡터 시계(vector clock)나 버전 벡터로 인과 관계를 추적하며, 지리적으로 분산된 데이터베이스가 분할 상황에서도 쓰기를 계속 받아들일 수 있게 한다.',
        '최종 일관성은 새로운 갱신이 더 이상 없다면 모든 복제본이 결국 같은 값으로 수렴한다는 약한 보장이다. 수렴까지의 시간에 대한 상한은 제공하지 않는다. 충돌 해소를 위해 마지막 쓰기 우선(LWW), 다중 버전 반환, CRDT 같은 기법이 쓰인다. 특히 CRDT는 병합 연산이 교환·결합·멱등 법칙을 만족하도록 자료구조를 설계해 조정 없이 수렴을 보장한다.',
        'CAP 정리는 분할(Partition)이 발생했을 때 일관성(Consistency)과 가용성(Availability) 중 하나를 포기해야 함을 말한다. 흔한 오해와 달리 셋 중 둘을 항상 선택하는 것이 아니라, 분할이 없는 정상 상황에서는 지연(latency)과 일관성 사이의 트레이드오프가 더 실질적이며 이를 PACELC 모델이 설명한다.',
        '실무에서는 하나의 시스템 안에서도 데이터 종류에 따라 서로 다른 모델을 조합한다. 예를 들어 계정 잔액은 선형화 가능성을 요구하지만 활동 피드는 최종 일관성으로 충분하다. 요구 사항을 명세할 때는 읽기 자체 쓰기(read-your-writes), 단조 읽기(monotonic reads), 단조 쓰기(monotonic writes) 같은 세션 보장을 명시하는 것이 유용하다.'
      ];
      var h = '<div class="doc"><h1>3장. 분산 시스템의 일관성 모델</h1><p class="sub">강의 노트 · 3주차 · 마지막 수정 ' + new Date().toISOString().slice(0, 10) + '</p>';
      h += '<h2>3.1 개요</h2><p>' + para[0] + '</p><p>' + para[5] + '</p>';
      h += '<h2>3.2 강한 일관성 모델</h2><p>' + para[1] + '</p><p>' + para[2] + '</p>';
      h += '<h2>3.3 약한 일관성 모델</h2><p>' + para[3] + '</p><p>' + para[4] + '</p>';
      h += '<h2>3.4 설계 지침</h2><p>' + para[6] + '</p><ul><li>데이터 항목별로 요구되는 최소 보장을 표로 정리한다.</li><li>분할 시 동작(거부/수락 후 조정)을 명시한다.</li><li>클라이언트 세션 보장을 API 계약에 포함한다.</li></ul>';
      h += '<h2>3.5 연습 문제</h2><p>1. 선형화 가능하지만 순차 일관성을 위반하는 이력이 존재하는가? 이유를 설명하라.</p><p>2. 두 복제본이 동시 쓰기를 받았을 때 LWW와 CRDT 카운터의 결과를 비교하라.</p><p>3. 읽기 자체 쓰기 보장을 최종 일관성 저장소 위에서 구현하는 방법을 제시하라.</p>';
      for (var i = 0; i < 3; i++) h += '<h2>부록 ' + String.fromCharCode(65 + i) + '. 보충 설명</h2><p>' + para[(i + 1) % para.length] + '</p><p>' + para[(i + 4) % para.length] + '</p>';
      return h + '</div>';
    }
    function togglePanic(force) {
      var on = force === undefined ? !panicOn : !!force;
      if (on === panicOn) return;
      panicOn = on;
      if (on) {
        if (!panicEl.innerHTML) panicEl.innerHTML = panicDoc();
        panicEl.hidden = false; app.hidden = true;
        document.title = '3장_일관성모델.docx - 문서'; document.getElementById('favicon').href = docIcon;
        panicEl.scrollTop = 0;
      } else {
        panicEl.hidden = true; app.hidden = false;
        document.title = normalTitle; document.getElementById('favicon').href = normalIcon;
        var cur = app.querySelector('.cursor') || app.querySelector('[data-key]'); if (cur) cur.focus();
      }
    }
    document.addEventListener('visibilitychange', function () { if (document.hidden) togglePanic(true); });

    // ── 8. 부팅 ────────────────────────────────────────────
    UI.state = A.resume() || A.newGame();
    if (UI.state.phase === 'game') UI.gameLines = UI.state.gameResult.log.length; // 경기 중 새로고침 → 전체 로그
    render();
  })();
  </script>
